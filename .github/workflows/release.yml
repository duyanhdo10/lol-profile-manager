name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Verify tag and release notes
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $version."
          }
          $notes = "release-notes/$env:GITHUB_REF_NAME.md"
          if (-not (Test-Path -LiteralPath $notes)) {
            throw "Missing bilingual release notes: $notes"
          }

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Run Electron end-to-end tests
        run: npm run test:e2e

      - name: Build update artifacts
        run: npm run package

      - name: Create draft release
        shell: pwsh
        run: |
          gh release create $env:GITHUB_REF_NAME `
            --draft `
            --verify-tag `
            --title "LoL Profile Manager $env:GITHUB_REF_NAME" `
            --notes-file "release-notes/$env:GITHUB_REF_NAME.md"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload update artifacts
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $expected = @(
            "release/LoL-Profile-Manager-Setup-$version.exe",
            "release/LoL-Profile-Manager-Setup-$version.exe.blockmap",
            "release/latest.yml"
          )
          foreach ($artifact in $expected) {
            if (-not (Test-Path -LiteralPath $artifact)) {
              throw "Missing update artifact: $artifact"
            }
          }
          gh release upload $env:GITHUB_REF_NAME @expected
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate draft assets on GitHub
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $expectedNames = @(
            "LoL-Profile-Manager-Setup-$version.exe",
            "LoL-Profile-Manager-Setup-$version.exe.blockmap",
            "latest.yml"
          )
          $release = gh release view $env:GITHUB_REF_NAME --json assets | ConvertFrom-Json
          $assets = @($release.assets)
          foreach ($expectedName in $expectedNames) {
            $asset = $assets | Where-Object name -EQ $expectedName
            if (-not $asset -or $asset.size -le 0) {
              throw "Missing or empty GitHub release asset: $expectedName"
            }
          }
          if ($assets.Count -ne $expectedNames.Count) {
            throw "Unexpected GitHub release asset count: $($assets.Count)"
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish official latest release
        shell: pwsh
        run: |
          gh release edit $env:GITHUB_REF_NAME `
            --draft=false `
            --prerelease=false `
            --latest `
            --notes-file "release-notes/$env:GITHUB_REF_NAME.md"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published latest release
        shell: pwsh
        run: |
          $release = gh release view $env:GITHUB_REF_NAME --json isDraft,isPrerelease | ConvertFrom-Json
          if ($release.isDraft -or $release.isPrerelease) {
            throw "Release was not published as an official release."
          }
          $latestTag = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq .tag_name
          if ($latestTag -ne $env:GITHUB_REF_NAME) {
            throw "Published release is not Latest: $latestTag"
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
