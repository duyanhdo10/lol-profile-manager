name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Verify tag and release notes
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $version."
          }
          $notes = "release-notes/$env:GITHUB_REF_NAME.md"
          if (-not (Test-Path -LiteralPath $notes)) {
            throw "Missing bilingual release notes: $notes"
          }

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Run Electron end-to-end tests
        run: npm run test:e2e

      - name: Build and upload update artifacts to draft
        run: npm exec electron-builder -- --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate update artifacts
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $expected = @(
            "release/LoL-Profile-Manager-Setup-$version.exe",
            "release/LoL-Profile-Manager-Setup-$version.exe.blockmap",
            "release/latest.yml"
          )
          foreach ($artifact in $expected) {
            if (-not (Test-Path -LiteralPath $artifact)) {
              throw "Missing update artifact: $artifact"
            }
          }

      - name: Publish official latest release
        shell: pwsh
        run: |
          gh release edit $env:GITHUB_REF_NAME `
            --draft=false `
            --prerelease=false `
            --latest `
            --notes-file "release-notes/$env:GITHUB_REF_NAME.md"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
